[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rosetta-flame"
version = "0.1.0"
description = "An app that helps me learn and improve my English."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
rosetta-flame = "rosetta_flame.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rosetta_flame"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
